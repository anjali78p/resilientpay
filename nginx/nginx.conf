server {
    listen 80;

    # Docker DNS: API container restart hone par naya IP automatically mile
    # (static proxy_pass se nginx purana IP pakad leta hai aur TTR galat aata hai)
    resolver 127.0.0.11 valid=2s;
    set $upstream http://api:8000;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
