services:
  db:
    image: postgres:15-alpine
    container_name: resilientpay-db
    restart: always
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: resilientpay-api
    restart: always            # chaos test me ise hata kar BASELINE TTR nikalna
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
    # Day 4 (EC2 par) ye uncomment karna => logs CloudWatch me:
    # logging:
    #   driver: awslogs
    #   options:
    #     awslogs-region: ap-south-1
    #     awslogs-group: resilientpay
    #     awslogs-create-group: "true"

  nginx:
    image: nginx:1.27-alpine
    container_name: resilientpay-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
